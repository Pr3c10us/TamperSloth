services:
  backend:
    build: .
    container_name: fazerlane_backend
    restart: unless-stopped
    environment:
      - TEST_SECRET:${TEST_SECRET}
      - PORT:${PORT}
      - CLIENT_ORIGIN:${CLIENT_ORIGIN}
      - COOKIE_EXPIRES:${COOKIE_EXPIRES}
      - COOKIE_SECRET:${COOKIE_SECRET}
      - EMAIL_JWT_EXPIRES:${EMAIL_JWT_EXPIRES}
      - EMAIL_JWT_SECRET:${EMAIL_JWT_SECRET}
      - JWT_EXPIRES:${JWT_EXPIRES}
      - JWT_SECRET:${JWT_SECRET}
      - REFRESH_JWT_EXPIRES:${REFRESH_JWT_EXPIRES}
      - REFRESH_JWT_SECRET:${REFRESH_JWT_SECRET}
      - WS_URL:${WS_URL}

      - POSTGRES_HOST:${POSTGRES_HOST}
      - POSTGRES_DB:${POSTGRES_DB}
      - POSTGRES_USER:${POSTGRES_USER}
      - POSTGRES_PASSWORD:${POSTGRES_PASSWORD}
      - POSTGRES_PORT:${POSTGRES_PORT}
      - POSTGRES_SSL:${POSTGRES_SSL}
      - POSTGRES_URL:${POSTGRES_URL}

      - REDIS_USER:${REDIS_USER}
      - REDIS_PASSWORD:${REDIS_PASSWORD}
      - REDIS_HOST:${REDIS_HOST}
      - REDIS_PORT:${REDIS_PORT}

      - GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CLIENT_CALLBACK_URL:${GOOGLE_CLIENT_CALLBACK_URL}

      - GEMINI_API_KEY:${GEMINI_API_KEY}
      - GEMINI_MODEL:${GEMINI_MODEL}

      - MAX_VIDEO_LENGTH:${MAX_VIDEO_LENGTH}
      - MAX_YOUTUBE_LENGTH:${MAX_YOUTUBE_LENGTH}
      - BASE_YOUTUBE_API_URL:${BASE_YOUTUBE_API_URL}
      - GOOGLE_API_KEY:${GOOGLE_API_KEY}

      - SMTP_FROM_ADDRESS:${SMTP_FROM_ADDRESS}
      - SMTP_HOST:${SMTP_HOST}
      - SMTP_PASSWORD:${SMTP_PASSWORD}
      - SMTP_PORT:${SMTP_PORT}
      - SMTP_USERNAME:${SMTP_USERNAME}

      - VERIFICATION_EMAIL_URL:${VERIFICATION_EMAIL_URL}
      - RESET_PASSWORD_EMAIL_URL:${RESET_PASSWORD_EMAIL_URL}
      - UI_LOGIN_URL:${UI_LOGIN_URL}
      - UI_DASHBOARD_URL:${UI_DASHBOARD_URL}
      - LOGO_URL:${LOGO_URL}

      - STORAGE_ACCOUNT_ID:${STORAGE_ACCOUNT_ID}
      - STORAGE_ACCESS_KEY_ID:${STORAGE_ACCESS_KEY_ID}
      - STORAGE_SECRET_ACCESS_KEY:${STORAGE_SECRET_ACCESS_KEY}
      - STORAGE_BUCKET_NAME:${STORAGE_BUCKET_NAME}
      - STORAGE_BUCKET_PUBLIC_DOMAIN:${STORAGE_BUCKET_PUBLIC_DOMAIN}

      - QDRANT_PORT:${QDRANT_PORT}
      - QDRANT_HOST:${QDRANT_HOST}
    ports:
      - "5000:5000"
    networks:
      - fazerlane_network

  #stgres:
  #image: ankane/pgvector
  #container_name: postgres_db
  #restart: unless-stopped
  #environment:
  #  POSTGRES_DB: ${POSTGRES_DB}
  #  POSTGRES_USER: ${POSTGRES_USER}
  #  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #ports:
